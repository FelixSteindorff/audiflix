name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-test:
    name: wxPython regression tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GUI test dependencies
        run: python -m pip install pytest requests keyring "wxPython>=4.2"
      - name: Compile translations
        run: python tools/i18n_tool.py compile
      - name: Run all tests including native controls
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade "ruff==0.16.5"

      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite deliberately avoids wxPython, VLC and a live server, so
      # only pytest and the pure-Python runtime dependencies are needed here.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests keyring

      - name: Compile translation catalogs
        run: python tools/i18n_tool.py compile

      - name: Check that the message template is up to date
        run: |
          python tools/i18n_tool.py extract
          git diff --exit-code --ignore-matching-lines='POT-Creation-Date' -- src/audiflix/locale/audiflix.pot

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
